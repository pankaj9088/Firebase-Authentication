<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | Firebase Auth</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>
  <div class="container">
    <h2>Login</h2>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Password">
    <button id="loginBtn">Login</button>
    <p>Don't have an account? <a href="signup.html">Sign up</a></p>
    <hr>
     
    <button id="googleLogin"><i class="bi bi-google" style="color:#2614aa; font-size:20px;"></i>    Sign in with Google</button>
   
    <button id="microsoftLogin"><i class="bi bi-microsoft" style="color:#b21021; font-size:20px;"></i>    Sign in with Microsoft</button>
    
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
